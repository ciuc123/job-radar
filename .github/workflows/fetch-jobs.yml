name: Fetch job sources

on:
  schedule:
    - cron: "0 0,12 * * *"
      timezone: "Europe/Bucharest"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run jobs:fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_DAILY_LIMIT: ${{ secrets.AI_DAILY_LIMIT }}
          AI_BATCH_LIMIT: ${{ secrets.AI_BATCH_LIMIT }}
      - if: ${{ always() && !cancelled() }}
        run: npm run notifications:send
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_NOTIFICATIONS_ENABLED: ${{ secrets.EMAIL_NOTIFICATIONS_ENABLED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
