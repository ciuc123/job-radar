services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jobradar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobradar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - jobradar-postgres:/var/lib/postgresql/data

volumes:
  jobradar-postgres:
